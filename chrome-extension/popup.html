<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hover Format Tools</title>
  <style>
    body {
      width: 350px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      margin: 0;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }
    
    .section {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .section:last-child {
      border-bottom: none;
    }
    
    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    
    .toggle-label {
      font-weight: 500;
      color: #333;
    }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #4CAF50;
    }
    
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    
    .config-group {
      margin-top: 10px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-size: 12px;
    }
    
    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      box-sizing: border-box;
      font-family: 'Consolas', 'Monaco', monospace;
    }
    
    textarea {
      min-height: 60px;
      resize: vertical;
    }
    
    .hint {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }
    
    .save-btn {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    
    .save-btn:hover {
      background-color: #45a049;
    }
    
    .save-btn:active {
      background-color: #3d8b40;
    }
    
    .status {
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      color: #4CAF50;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>⚙️ Hover Format Tools</h1>
  
  <div class="section">
    <div class="toggle-group">
      <span class="toggle-label">🕒 Timestamp Formatter</span>
      <label class="switch">
        <input type="checkbox" id="timestampEnabled" checked>
        <span class="slider"></span>
      </label>
    </div>
    
    <div class="config-group" id="timestampConfig">
      <label for="format">Time Format:</label>
      <input type="text" id="format" value="YYYY-MM-DD HH:mm:ss" placeholder="YYYY-MM-DD HH:mm:ss">
      <div class="hint">YYYY=year, MM=month, DD=day, HH=hour, mm=minute, ss=second</div>
      
      <label for="timezones" style="margin-top: 10px;">Timezones (one per line):</label>
      <textarea id="timezones" placeholder="UTC&#10;Asia/Shanghai&#10;America/New_York">UTC
Asia/Shanghai</textarea>
      <div class="hint">Examples: UTC, Asia/Shanghai, America/New_York, Europe/London</div>
    </div>
  </div>
  
  <div class="section">
    <div class="toggle-group">
      <span class="toggle-label">🔓 Base64 Decoder</span>
      <label class="switch">
        <input type="checkbox" id="base64Enabled" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>
  
  <button class="save-btn" id="saveBtn">Save Settings</button>
  <div class="status" id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
